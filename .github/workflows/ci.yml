name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest suite
        run: pytest backend/tests -v

  frontend-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Vitest unit & integration tests
        working-directory: frontend
        run: npm run test:unit
      - name: Run TypeScript check & Node audit tests
        working-directory: frontend
        run: npm test
      - name: Build Next.js production bundle
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend & frontend dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install chromium --with-deps
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e

